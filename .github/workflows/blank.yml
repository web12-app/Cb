name: Cb Download Server

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cb-download-server
  cancel-in-progress: false

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Start Node.js server and Cloudflare Tunnel
        env:
          PORT: 3000
        run: |
          set -e

          nohup npm start > server.log 2>&1 &
          echo $! > server.pid

          echo "Waiting for Node.js server..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then
              break
            fi
            sleep 2
          done

          curl -fsS http://localhost:3000/api/health

          echo "Downloading cloudflared..."
          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared

          chmod +x cloudflared

          echo "Starting temporary Cloudflare Tunnel..."
          nohup ./cloudflared tunnel \
            --no-autoupdate \
            --url http://localhost:3000 \
            > tunnel.log 2>&1 &

          echo $! > tunnel.pid

          echo "Waiting for public URL..."
          for i in $(seq 1 60); do
            TUNNEL_URL=$(grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' tunnel.log | head -n 1 || true)

            if [ -n "$TUNNEL_URL" ]; then
              echo "=================================="
              echo "Cloudflare Tunnel URL: $TUNNEL_URL"
              echo "=================================="
              break
            fi

            sleep 2
          done

          if [ -z "${TUNNEL_URL:-}" ]; then
            echo "Tunnel URL was not generated."
            cat tunnel.log
            exit 1
          fi

          echo "Server and tunnel are running."
          echo "GitHub Actions runner will keep them alive while this job runs."

          # Keep the workflow alive; GitHub-hosted runners are temporary.
          while kill -0 "$(cat server.pid)" 2>/dev/null \
            && kill -0 "$(cat tunnel.pid)" 2>/dev/null; do
            sleep 30
          done

      - name: Show logs if the job fails
        if: failure()
        run: |
          echo "===== Server log ====="
          cat server.log 2>/dev/null || true
          echo "===== Tunnel log ====="
          cat tunnel.log 2>/dev/null || true
