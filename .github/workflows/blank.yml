name: Check Git Tags

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: List Branches and Tags
        run: |
          echo "=== Remote Tags ==="
          git ls-remote --tags origin

          echo ""
          echo "=== Local Tags ==="
          git tag --list

          echo ""
          echo "=== Latest Commits ==="
          git log -5 --oneline
