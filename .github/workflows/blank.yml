name: YouTube Downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "YouTube video URL"
        required: true
        type: string
      format:
        description: "Video quality"
        required: true
        type: choice
        options:
          - "best"
          - "2160p"
          - "1440p"
          - "1080p"
        default: "2160p"

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          python3 -m pip install -U yt-dlp --break-system-packages

      - name: Download YouTube video
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          QUALITY: ${{ inputs.format }}
        run: |
          mkdir -p downloads

          case "$QUALITY" in
            2160p) HEIGHT=2160 ;;
            1440p) HEIGHT=1440 ;;
            1080p) HEIGHT=1080 ;;
            *) HEIGHT=4320 ;;
          esac

          yt-dlp \
            --no-playlist \
            --max-filesize 5G \
            -f "bestvideo[height<=${HEIGHT}]+bestaudio/best[height<=${HEIGHT}]" \
            --merge-output-format mp4 \
            -o "downloads/%(title).150s.%(ext)s" \
            "$VIDEO_URL"

      - name: Upload downloaded video
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video
          path: downloads/
          if-no-files-found: error
          retention-days: 2
