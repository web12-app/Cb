name: Cb Download Server

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cb-download-server
  cancel-in-progress: false

jobs:
  server:
    name: Node.js and Cloudflare Tunnel
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip ffmpeg curl

      - name: Install yt-dlp
        run: |
          set -e
          python3 -m pip install --user --break-system-packages yt-dlp

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          "$HOME/.local/bin/yt-dlp" --version

      - name: Install Node.js dependencies
        run: npm install --no-audit --no-fund

      - name: Start Node.js server
        env:
          PORT: "3000"
        run: |
          set -e
          nohup npm start > server.log 2>&1 &
          echo $! > server.pid

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              echo "Server is ready."
              exit 0
            fi
            sleep 2
          done

          cat server.log
          exit 1

      - name: Install Cloudflare Tunnel
        run: |
          set -e

          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared

          chmod +x cloudflared
          ./cloudflared --version

      - name: Start Cloudflare Tunnel
        run: |
          set -e

          nohup ./cloudflared tunnel \
            --no-autoupdate \
            --url http://127.0.0.1:3000 \
            > tunnel.log 2>&1 &

          echo $! > tunnel.pid

          TUNNEL_URL=""

          for i in $(seq 1 60); do
            TUNNEL_URL=$(
              grep -Eo \
                'https://[a-zA-Z0-9-]+\.trycloudflare\.com' \
                tunnel.log | head -n 1 || true
            )

            if [ -n "$TUNNEL_URL" ]; then
              break
            fi

            sleep 2
          done

          if [ -z "$TUNNEL_URL" ]; then
            cat tunnel.log
            echo "::error::Cloudflare Tunnel URL was not created."
            exit 1
          fi

          echo "======================================"
          echo "Cb Public URL: $TUNNEL_URL"
          echo "======================================"

          echo "TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_ENV"

      - name: Verify API
        run: |
          curl --fail --show-error \
            --retry 5 \
            --retry-delay 3 \
            "$TUNNEL_URL/api/health"

      - name: Keep server running
        run: |
          echo "Cb server is running."
          echo "Public URL: $TUNNEL_URL"

          while true; do
            if ! kill -0 "$(cat server.pid)" 2>/dev/null; then
              cat server.log
              exit 1
            fi

            if ! kill -0 "$(cat tunnel.pid)" 2>/dev/null; then
              cat tunnel.log
              exit 1
            fi

            sleep 30
          done

      - name: Print logs on failure
        if: failure()
        run: |
          echo "===== Server logs ====="
          cat server.log 2>/dev/null || true

          echo "===== Tunnel logs ====="
          cat tunnel.log 2>/dev/null || true
