<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">

  <title>Cb Downloader</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: grid;
      place-items: center;
      background: #101114;
      color: #f5f5f7;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 560px;
      padding: 26px;
      border: 1px solid #34353d;
      border-radius: 22px;
      background: #1b1c21;
    }

    .logo {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: #dce4ff;
      color: #171923;
      font-weight: 800;
      font-size: 24px;
    }

    h1 {
      margin: 18px 0 8px;
      font-size: 28px;
    }

    .description {
      color: #b8bac5;
      line-height: 1.6;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-size: 14px;
      font-weight: 600;
    }

    input,
    select,
    button {
      width: 100%;
      min-height: 48px;
      padding: 12px;
      border-radius: 12px;
      font: inherit;
    }

    input,
    select {
      background: #111216;
      border: 1px solid #41434d;
      color: white;
    }

    button {
      margin-top: 18px;
      border: 0;
      background: #dce4ff;
      color: #151720;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .status {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      background: #111216;
      border: 1px solid #34353d;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }

    .hidden {
      display: none;
    }

    .thumbnail {
      display: block;
      width: 100%;
      margin-top: 14px;
      border-radius: 12px;
    }

    .download-link {
      display: inline-block;
      margin-top: 12px;
      color: #b8c7ff;
    }

    .note {
      margin-top: 18px;
      color: #9295a2;
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="logo">Cb</div>

    <h1>Cb Downloader</h1>

    <p class="description">
      Enter a YouTube URL to retrieve video information from the connected API.
      Use only content you own or are authorized to download.
    </p>

    <form id="downloadForm">
      <label for="videoUrl">Video URL</label>

      <input
        id="videoUrl"
        type="url"
        placeholder="https://www.youtube.com/watch?v=..."
        autocomplete="url"
        required
      >

      <label for="quality">Video quality</label>

      <select id="quality">
        <option value="best">Best available</option>
        <option value="1080">1080p</option>
        <option value="720">720p</option>
        <option value="480">480p</option>
        <option value="360">360p</option>
      </select>

      <button id="submitButton" type="submit">
        Get Video Information
      </button>
    </form>

    <section
      id="result"
      class="status hidden"
      aria-live="polite"
    ></section>

    <p class="note">
      The API must support the requested operation. Video metadata alone
      does not guarantee a browser-ready download link.
    </p>
  </main>

  <script>
    const form = document.getElementById("downloadForm");
    const videoInput = document.getElementById("videoUrl");
    const qualityInput = document.getElementById("quality");
    const button = document.getElementById("submitButton");
    const result = document.getElementById("result");

    // Uses the same origin as the HTML page.
    const API_URL = "/api/download";

    function showMessage(message) {
      result.replaceChildren();
      result.classList.remove("hidden");
      result.textContent = message;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const url = videoInput.value.trim();
      const quality = qualityInput.value;

      button.disabled = true;
      button.textContent = "Connecting to API...";
      showMessage("Requesting video information...");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            url,
            quality
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(
            data.error || `Request failed (${response.status})`
          );
        }

        result.replaceChildren();

        const title = document.createElement("h3");
        title.textContent = data.title || "Video information";
        result.appendChild(title);

        if (data.thumbnail) {
          const image = document.createElement("img");
          image.className = "thumbnail";
          image.src = data.thumbnail;
          image.alt = "Video thumbnail";
          image.referrerPolicy = "no-referrer";
          result.appendChild(image);
        }

        if (Number.isFinite(data.duration)) {
          const duration = document.createElement("p");
          duration.textContent = `Duration: ${data.duration} seconds`;
          result.appendChild(duration);
        }

        if (Array.isArray(data.formats) && data.formats.length) {
          const heading = document.createElement("p");
          heading.textContent = "Available formats:";
          result.appendChild(heading);

          const list = document.createElement("ul");

          data.formats.forEach((format) => {
            const item = document.createElement("li");
            const resolution = format.height
              ? `${format.height}p`
              : "Unknown resolution";

            item.textContent =
              `${resolution} · ${format.ext || "unknown"} · ID ${format.format_id}`;

            list.appendChild(item);
          });

          result.appendChild(list);
        }

        if (data.downloadUrl) {
          const link = document.createElement("a");
          link.className = "download-link";
          link.href = data.downloadUrl;
          link.textContent = "Open download link";
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          result.appendChild(link);
        } else {
          const message = document.createElement("p");
          message.textContent =
            data.message ||
            "Video information received. A download endpoint is not configured.";
          result.appendChild(message);
        }

        result.classList.remove("hidden");
      } catch (error) {
        showMessage(
          `${error.message}. Check that the API server is running and reachable.`
        );
      } finally {
        button.disabled = false;
        button.textContent = "Get Video Information";
      }
    });
  </script>
</body>
</html>
