<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cb Direct Downloader</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #101114;
      color: #f5f5f7;
      font-family: system-ui, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 28px;
      background: #1b1c21;
      border: 1px solid #34353d;
      border-radius: 22px;
    }

    h1 { margin-top: 0; }

    p {
      color: #b8bac5;
      line-height: 1.5;
    }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 12px;
      font: inherit;
    }

    input {
      background: #111216;
      border: 1px solid #41434d;
      color: white;
    }

    button {
      background: #dce4ff;
      border: 0;
      color: #151720;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #result {
      overflow-wrap: anywhere;
      margin-top: 18px;
    }

    a { color: #b8c7ff; }
  </style>
</head>

<body>
  <main class="card">
    <h1>Cb Downloader</h1>
    <p>Enter a direct HTTPS video-file URL that you own or are authorized to download.</p>

    <form id="downloadForm">
      <input
        id="videoUrl"
        type="url"
        placeholder="https://example.com/video.mp4"
        autocomplete="url"
        required
      >

      <button id="submitButton" type="submit">
        Create Download Link
      </button>
    </form>

    <div id="result" role="status" aria-live="polite"></div>
  </main>

  <script>
    const form = document.getElementById("downloadForm");
    const input = document.getElementById("videoUrl");
    const button = document.getElementById("submitButton");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      result.textContent = "";
      button.disabled = true;
      button.textContent = "Checking URL...";

      try {
        const response = await fetch("/api/download", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ url: input.value.trim() })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Unable to create link.");
        }

        const link = document.createElement("a");
        link.href = data.downloadUrl;
        link.textContent = "Open direct download URL";
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        result.textContent = data.message + " ";
        result.appendChild(link);
      } catch (error) {
        result.textContent = error.message;
      } finally {
        button.disabled = false;
        button.textContent = "Create Download Link";
      }
    });
  </script>
</body>
</html>
